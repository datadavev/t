[project]
name = "myt"
version = "0.5.6"
description = "Time, zones"
authors = [{ name = "datadavev", email = "605409+datadavev@users.noreply.github.com" }]
requires-python = "~=3.7"
readme = "README.md"
license = "Apache-2.0"
keywords = [
    "time",
    "timezones",
    "utility",
]
dependencies = [
    "dateparser>=1.0.0,<2",
    "click>=7.1.2,<8",
    "pytz~=2021.1",
    "requests>=2.25.1,<3",
    "tzdata~=2021.1",
    "icalendar>=4.1.0,<5",
    "recurring-ical-events>=1.0.3b0,<2",
    "timehash~=1.2",
]

[project.urls]
Homepage = "https://github.com/datadavev/t"
Repository = "https://github.com/datadavev/t"

[project.scripts]
t = "t.__main__:main"

[dependency-groups]
dev = [
    "black~=20.8b1",
    "Transcrypt>=3.9.0,<4",
]

[tool.hatch.build.targets.sdist]
include = ["t"]

[tool.hatch.build.targets.wheel]
include = ["t"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
